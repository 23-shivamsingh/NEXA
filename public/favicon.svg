<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep cosmic midnight canvas -->
    <linearGradient id="nexa-bg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Outer Rim: Subtle electric cyan to deep indigo bevel -->
    <linearGradient id="nexa-rim" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="nexa-glow" cx="16" cy="16" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Core Moment Gradient -->
    <linearGradient id="core-grad" x1="13" y1="13" x2="19" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Wave Gradient -->
    <linearGradient id="wave-inner" x1="0" y1="10" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Outer Resonance Wave Gradient -->
    <linearGradient id="wave-outer" x1="0" y1="6" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Base Container: Ensures 100% contrast on dark and light browser tabs -->
  <rect width="32" height="32" rx="7.5" fill="url(#nexa-bg)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="url(#nexa-rim)" stroke-width="1.2" />

  <!-- 2. Ambient Soft Energy Field behind resonant core -->
  <circle cx="16" cy="16" r="10" fill="url(#nexa-glow)" />

  <!-- 3. Outer Resonance / Orbit Wave Pair -->
  <!-- Left Outer Arc -->
  <path
    d="M 8.5 7.7 A 11.2 11.2 0 0 0 8.5 24.3"
    fill="none"
    stroke="url(#wave-outer)"
    stroke-width="2.3"
    stroke-linecap="round"
  />
  <!-- Right Outer Arc with Orbit trajectory -->
  <path
    d="M 23.5 7.7 A 11.2 11.2 0 0 1 23.5 24.3"
    fill="none"
    stroke="url(#wave-outer)"
    stroke-width="2.3"
    stroke-linecap="round"
  />

  <!-- 4. Inner Resonance Wave Pair -->
  <!-- Left Inner Arc -->
  <path
    d="M 11.5 11.5 A 6.4 6.4 0 0 0 11.5 20.5"
    fill="none"
    stroke="url(#wave-inner)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <!-- Right Inner Arc -->
  <path
    d="M 20.5 11.5 A 6.4 6.4 0 0 1 20.5 20.5"
    fill="none"
    stroke="url(#wave-inner)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- 5. Central Resonant Moment Core -->
  <circle cx="16" cy="16" r="3.2" fill="url(#core-grad)" />
  <!-- Micro specular glint -->
  <circle cx="15.1" cy="15.1" r="0.85" fill="#ffffff" opacity="0.9" />

  <!-- 6. Active Satellite Moment Beacon on outer resonance crest -->
  <circle cx="23.5" cy="7.7" r="1.3" fill="#ffffff" />
  <circle cx="23.5" cy="7.7" r="2.2" fill="#00f2fe" opacity="0.4" />
</svg>
